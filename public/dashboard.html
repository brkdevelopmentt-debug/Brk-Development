<script>
// Sayfa yüklendiğinde kullanıcı listesini otomatik çek
document.addEventListener('DOMContentLoaded', () => {
    loadAdminUsers();
});

// API'den üyeleri çeker ve listeler
async function loadAdminUsers() {
    try {
        const response = await fetch('/api/get-users');
        const data = await response.json();
        
        if (data.success) {
            // "admin-user-list", HTML tarafında üyelerin listeleneceği <div> veya <tbody> elementinin ID'si olmalı. 
            // Kendine göre id adını (admin-user-list) değiştirebilirsin.
            const userListDiv = document.getElementById('admin-user-list'); 
            if (!userListDiv) return; // Eğer o sekmede değilsek hata vermesin
            
            userListDiv.innerHTML = ''; // Önce listeyi temizle
            
            for (const [email, details] of Object.entries(data.users)) {
                userListDiv.innerHTML += `
                    <div style="margin-bottom: 10px; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                        <strong>Kullanıcı:</strong> ${email} <br>
                        <strong>Mevcut Bot Limiti:</strong> ${details.botLimit} <br>
                        
                        <input type="number" id="limit-${email}" value="${details.botLimit}" placeholder="Yeni Limit" style="margin-top: 5px; padding: 5px;">
                        <button onclick="updateUserLimit('${email}')" style="padding: 5px 10px; cursor: pointer;">Limiti Kaydet</button>
                    </div>
                `;
            }
        }
    } catch (error) {
        console.error('Kullanıcılar yüklenemedi:', error);
    }
}

// "Limiti Kaydet" butonuna basıldığında çalışır
async function updateUserLimit(email) {
    const newLimit = document.getElementById(`limit-${email}`).value;
    
    try {
        const response = await fetch('/api/update-user-limit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email, limit: newLimit })
        });
        
        const result = await response.json();
        
        if (result.success) {
            alert('Başarılı: ' + result.message);
            loadAdminUsers(); // Kayıt sonrası listeyi güncel değerlerle yenile
        } else {
            alert('Hata: ' + result.error);
        }
    } catch (error) {
        console.error('Limit güncellenirken bir sorun oluştu:', error);
        alert('Sunucu ile bağlantı koptu.');
    }
}
</script>
