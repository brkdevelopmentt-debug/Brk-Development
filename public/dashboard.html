<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lux Development - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .navbar { background-color: #1e293b; border-bottom: 1px solid #334155; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; }
        .form-control { background-color: #0f172a; border: 1px solid #334155; color: #fff; }
        .form-control:focus { background-color: #0f172a; color: #fff; border-color: #38bdf8; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark px-4">
    <a class="navbar-brand fw-bold text-info" href="#">Lux Dev Bot Panel</a>
    <span class="text-light" id="displayUsername">Yükleniyor...</span>
</nav>

<div class="container mt-4">
    <div class="row g-4">
        <div class="col-md-4">
            <div class="card p-3">
                <h5>API Key</h5>
                <p class="text-warning small" id="displayApiKey">Yükleniyor...</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card p-3">
                <h5>Maksimum Bot Hakkı</h5>
                <h3 class="text-info" id="displayMaxBots">0</h3>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card p-3">
                <h5>Aktif Bot Sayısı</h5>
                <h3 class="text-success" id="displayActiveBots">0</h3>
            </div>
        </div>
    </div>

    <div class="card mt-4 p-4">
        <h4>Bot Yönetim Kontrolü</h4>
        <div class="row mt-3">
            <div class="col-md-6">
                <input type="number" id="botCountInput" class="form-control" placeholder="Basılacak bot miktarını girin">
            </div>
            <div class="col-md-6 d-flex gap-2">
                <button id="btnStartBot" class="btn btn-success fw-bold w-50">Başlat</button>
                <button id="btnStopBot" class="btn btn-danger fw-bold w-50">Durdur</button>
            </div>
        </div>
    </div>
</div>

<script src="dashboard.js"></script>
</body>
</html>
