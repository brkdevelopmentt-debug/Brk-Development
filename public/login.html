<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brk Development - Giriş Yap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #050505; color: #ededed; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .auth-container { background: #0f0f11; border: 1px solid #1f1f23; border-radius: 16px; width: 100%; max-width: 420px; padding: 40px 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .brand-title { color: #6366f1; font-weight: 800; font-size: 28px; text-transform: uppercase; letter-spacing: 1px; }
        .form-control { background-color: #18181b; border: 1px solid #27272a; color: #fff; padding: 12px; border-radius: 8px; }
        .form-control:focus { background-color: #18181b; color: #fff; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); }
        .btn-brand { background-color: #6366f1; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; transition: all 0.2s; }
        .btn-brand:hover { background-color: #4f46e5; color: white; transform: translateY(-1px); }
        .nav-tabs { border-bottom: 1px solid #1f1f23; margin-bottom: 25px; }
        .nav-tabs .nav-link { color: #71717a; border: none; font-weight: 600; padding-bottom: 15px; }
        .nav-tabs .nav-link.active { background-color: transparent; color: #6366f1; border-bottom: 2px solid #6366f1; }
        label { color: #a1a1aa; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="text-center mb-4">
        <h2 class="brand-title">BRK DEVELOPMENT</h2>
        <p class="text-muted small mt-1">Bot Yönetim Paneli</p>
    </div>
    
    <div id="alertBox" class="alert p-2 text-center text-sm" style="display: none; font-size: 14px; border-radius: 8px;"></div>

    <ul class="nav nav-tabs nav-justified" id="authTab">
        <li class="nav-item">
            <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button">Giriş Yap</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button">Kayıt Ol</button>
        </li>
    </ul>

    <div class="tab-content" id="authTabContent">
        <div class="tab-pane fade show active" id="login">
            <form id="loginForm">
                <div class="mb-3">
                    <label>Kullanıcı Adı</label>
                    <input type="text" id="loginUsername" class="form-control" required placeholder="Kullanıcı adınızı girin">
                </div>
                <div class="mb-4">
                    <label>Şifre</label>
                    <input type="password" id="loginPassword" class="form-control" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-brand w-100">Sisteme Gir</button>
            </form>
        </div>

        <div class="tab-pane fade" id="register">
            <form id="registerForm">
                <div class="mb-3">
                    <label>Kullanıcı Adı</label>
                    <input type="text" id="regUsername" class="form-control" required placeholder="Kullanıcı adınızı belirleyin">
                </div>
                <div class="mb-4">
                    <label>Şifre</label>
                    <input type="password" id="regPassword" class="form-control" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-brand w-100" style="background-color: #10b981;">Hesap Oluştur</button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="login.js"></script>
</body>
</html>
