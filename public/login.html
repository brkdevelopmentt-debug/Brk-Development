<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brk Dev - Giriş & Kayıt</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', 'Segoe UI', sans-serif; }
        body { background: #0a0c14; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }

        .auth-card { background: rgba(22, 25, 41, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(88, 101, 242, 0.2); padding: 40px; border-radius: 16px; width: 100%; max-width: 420px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
        .logo-box { text-align: center; margin-bottom: 20px; }
        .logo-box img { width: 75px; height: 75px; border-radius: 50%; border: 2px solid #5865f2; box-shadow: 0 0 15px rgba(88, 101, 242, 0.5); }
        .auth-card h2 { text-align: center; margin-bottom: 20px; color: #fff; font-size: 24px; font-weight: 700; }

        .input-group { margin-bottom: 18px; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 12px; color: #8e92a8; text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; }
        .input-group input { width: 100%; padding: 12px 16px; background: #0e101d; border: 1px solid #23273a; border-radius: 8px; color: #fff; outline: none; transition: 0.3s; }
        .input-group input:focus { border-color: #5865f2; box-shadow: 0 0 8px rgba(88, 101, 242, 0.4); }

        .btn-submit { width: 100%; padding: 13px; background: linear-gradient(135deg, #5865f2, #4752c4); border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; font-size: 15px; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(88, 101, 242, 0.4); }

        .toggle-link { text-align: center; margin-top: 20px; font-size: 14px; color: #8e92a8; cursor: pointer; }
        .toggle-link span { color: #5865f2; font-weight: bold; }

        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: #181b2e; border-left: 4px solid #5865f2; color: #fff; padding: 14px 20px; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 12px; min-width: 280px; animation: slideIn 0.3s forwards; }
        .toast.success { border-left-color: #2ecc71; }
        .toast.error { border-left-color: #e74c3c; }

        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div class="auth-card" id="login-box">
        <div class="logo-box">
            <img src="https://cdn.discordapp.com/embed/avatars/0.png" id="brand-logo" alt="Brk Dev">
        </div>
        <h2>Brk Dev Panel</h2>
        <div class="input-group">
            <label>Kullanıcı Adı</label>
            <input type="text" id="login-user" placeholder="Kullanıcı adınızı girin">
        </div>
        <div class="input-group">
            <label>Şifre</label>
            <input type="password" id="login-pass" placeholder="••••••••">
        </div>
        <button class="btn-submit" onclick="login()">Giriş Yap</button>
        <div class="toggle-link" onclick="toggleAuth(true)">Hesabın yok mu? <span>Kayıt Ol</span></div>
    </div>

    <div class="auth-card" id="register-box" style="display: none;">
        <div class="logo-box">
            <img src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Brk Dev">
        </div>
        <h2>Kayıt Ol</h2>
        <div class="input-group">
            <label>Kullanıcı Adı</label>
            <input type="text" id="reg-user" placeholder="Kullanıcı adınız">
        </div>
        <div class="input-group">
            <label>Şifre (6 - 24 Karakter)</label>
            <input type="password" id="reg-pass" maxlength="24" placeholder="••••••••">
        </div>
        <button class="btn-submit" onclick="register()">Kayıt İşlemini Tamamla</button>
        <div class="toggle-link" onclick="toggleAuth(false)">Hesabın var mı? <span>Giriş Yap</span></div>
    </div>

    <script>
        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation'}"></i> <div>${msg}</div>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3500);
        }

        function toggleAuth(isRegister) {
            document.getElementById('login-box').style.display = isRegister ? 'none' : 'block';
            document.getElementById('register-box').style.display = isRegister ? 'block' : 'none';
        }

        async function register() {
            const username = document.getElementById('reg-user').value.trim();
            const password = document.getElementById('reg-pass').value;

            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await res.json();
            if (res.ok) {
                localStorage.setItem('brk_token', data.token);
                showToast('Kayıt Başarılı! Yönlendiriliyorsunuz...', 'success');
                setTimeout(() => window.location.href = '/index.html', 800);
            } else {
                showToast(data.error, 'error');
            }
        }

        async function login() {
            const username = document.getElementById('login-user').value.trim();
            const password = document.getElementById('login-pass').value;

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await res.json();
            if (res.ok) {
                localStorage.setItem('brk_token', data.token);
                showToast('Giriş Başarılı!', 'success');
                setTimeout(() => window.location.href = '/index.html', 800);
            } else {
                showToast(data.error, 'error');
            }
        }
    </script>
</body>
</html>
