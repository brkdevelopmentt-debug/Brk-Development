<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fake-players | Giriş</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { background: #131b2e; padding: 40px; border-radius: 12px; box-shadow: 0 0 25px rgba(0, 210, 255, 0.15); width: 380px; border: 1px solid #1f293d; text-align: center; }
        .logo-area { margin-bottom: 25px; }
        .logo-area img { width: 65px; height: 65px; border-radius: 50%; margin-bottom: 12px; border: 2px solid #00d2ff; object-fit: cover; }
        .logo-area h1 { font-size: 22px; color: #00d2ff; letter-spacing: 1px; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #0b0f19; border: 1px solid #2a3b5e; color: white; border-radius: 6px; outline: none; transition: 0.3s; }
        input:focus { border-color: #00d2ff; box-shadow: 0 0 8px rgba(0, 210, 255, 0.3); }
        button { width: 100%; padding: 12px; background: linear-gradient(135deg, #00d2ff, #0076ff); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 15px; transition: 0.3s; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-area">
            <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
            <h1>BRK DEVS</h1>
        </div>
        <input type="text" id="user" placeholder="Kullanıcı Adı">
        <input type="password" id="pass" placeholder="Şifre">
        <button onclick="girisYap()">Sisteme Giriş Yap</button>
    </div>

    <script>
        function girisYap() {
            const u = document.getElementById('user').value;
            if(u.trim() !== "") {
                localStorage.setItem('brk_user', u);
                window.location.href = '/dashboard';
            } else {
                alert('Kullanıcı adını boş bırakma gardaş!');
            }
        }
    </script>
</body>
</html>
