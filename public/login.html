<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brk Dev - Giriş & Kayıt</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f111a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }

        .auth-card { background: #181b29; border: 1px solid #282c40; padding: 40px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative; }
        .auth-card h2 { text-align: center; margin-bottom: 24px; color: #5865f2; font-size: 26px; font-weight: 700; }

        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 13px; color: #a0a5b5; text-transform: uppercase; letter-spacing: 0.5px; }
        .input-group input { width: 100%; padding: 12px 16px; background: #0f111a; border: 1px solid #282c40; border-radius: 8px; color: #fff; outline: none; transition: 0.3s; }
        .input-group input:focus { border-color: #5865f2; }

        /* Şifre Barı */
        .strength-bar-container { width: 100%; height: 6px; background: #282c40; border-radius: 3px; margin-top: 8px; overflow: hidden; display: none; }
        .strength-bar { height: 100%; width: 0%; transition: width 0.3s, background-color 0.3s; }
        .strength-text { font-size: 11px; margin-top: 4px; text-align: right; color: #a0a5b5; display: none; }

        .btn-submit { width: 100%; padding: 12px; background: #5865f2; border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-submit:hover { background: #4752c4; }

        .toggle-link { text-align: center; margin-top: 20px; font-size: 14px; color: #a0a5b5; cursor: pointer; }
        .toggle-link span { color: #5865f2; font-weight: bold; }

        /* Google Tarzı Sağ-Orta Bildirim Toast */
        #toast-container { position: fixed; top: 50%; right: 20px; transform: translateY(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast { pointer-events: auto; background: #1f2333; border-left: 4px solid #5865f2; color: #fff; padding: 16px 20px; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); display: flex; align-items: center; gap: 12px; min-width: 280px; max-width: 360px; animation: slideIn 0.4s ease forwards; opacity: 0; transform: translateX(100%); }
        .toast.success { border-left-color: #2ecc71; }
        .toast.error { border-left-color: #e74c3c; }
        .toast i { font-size: 20px; }
        .toast.success i { color: #2ecc71; }
        .toast.error i { color: #e74c3c; }

        @keyframes slideIn {
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes slideOut {
            to { opacity: 0; transform: translateX(100%); }
        }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div class="auth-card" id="login-box">
        <h2>Brk Dev</h2>
        <div class="input-group">
            <label>Kullanıcı Adı</label>
            <input type="text" id="login-user" placeholder="Kullanıcı adınız">
        </div>
        <div class="input-group">
            <label>Şifre</label>
            <input type="password" id="login-pass" placeholder="••••••••">
        </div>
        <button class="btn-submit" onclick="login()">Giriş Yap</button>
        <div class="toggle-link" onclick="toggleAuth(true)">Hesabın yok mu? <span>Kayıt Ol</span></div>
    </div>

    <div class="auth-card" id="register-box" style="display: none;">
        <h2>Brk Dev - Kayıt</h2>
        <div class="input-group">
            <label>Kullanıcı Adı</label>
            <input type="text" id="reg-user" placeholder="Kullanıcı adınız">
        </div>
        <div class="input-group">
            <label>Şifre (6 - 24 Karakter)</label>
            <input type="password" id="reg-pass" maxlength="24" placeholder="••••••••" oninput="checkPasswordStrength(this.value)">
            <div class="strength-bar-container" id="bar-container">
                <div class="strength-bar" id="str-bar"></div>
            </div>
            <div class="strength-text" id="str-text"></div>
        </div>
        <button class="btn-submit" onclick="register()">Kayıt Ol</button>
        <div class="toggle-link" onclick="toggleAuth(false)">Zaten hesabın var mı? <span>Giriş Yap</span></div>
    </div>

    <script>
        // Bildirim Sesi (Google Pop Sesi Web Audio API Sentezi)
        function playNotificationSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15); // A5
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } catch (e) {
                console.log("Ses çalınamadı.");
            }
        }

        // Google UI Sağ-Orta Toast
        function showToast(message, type = 'success') {
            playNotificationSound();
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            const iconClass = type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation';
            toast.innerHTML = `<i class="fa-solid ${iconClass}"></i> <div>${message}</div>`;
            
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'slideOut 0.4s forwards';
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }

        function toggleAuth(isRegister) {
            document.getElementById('login-box').style.display = isRegister ? 'none' : 'block';
            document.getElementById('register-box').style.display = isRegister ? 'block' : 'none';
        }

        function checkPasswordStrength(pass) {
            const container = document.getElementById('bar-container');
            const bar = document.getElementById('str-bar');
            const text = document.getElementById('str-text');

            if (!pass) {
                container.style.display = 'none';
                text.style.display = 'none';
                return;
            }

            container.style.display = 'block';
            text.style.display = 'block';

            let score = 0;
            if (pass.length >= 6) score += 25;
            if (pass.length >= 10) score += 25;
            if (/[A-Z]/.test(pass)) score += 25;
            if (/[0-9!@#$%^&*]/.test(pass)) score += 25;

            bar.style.width = score + '%';

            if (score <= 25) {
                bar.style.backgroundColor = '#e74c3c';
                text.innerText = 'Çok Zayıf';
                text.style.color = '#e74c3c';
            } else if (score <= 50) {
                bar.style.backgroundColor = '#e67e22';
                text.innerText = 'Zayıf';
                text.style.color = '#e67e22';
            } else if (score <= 75) {
                bar.style.backgroundColor = '#f1c40f';
                text.innerText = 'Orta Güçlü';
                text.style.color = '#f1c40f';
            } else {
                bar.style.backgroundColor = '#2ecc71';
                text.innerText = 'Çok Güçlü';
                text.style.color = '#2ecc71';
            }
        }

        async function register() {
            const username = document.getElementById('reg-user').value.trim();
            const password = document.getElementById('reg-pass').value;

            if (password.length < 6 || password.length > 24) {
                showToast('Şifre 6 ile 24 karakter arasında olmalıdır!', 'error');
                return;
            }

            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await res.json();
            if (res.ok) {
                showToast(data.message, 'success');
                setTimeout(() => toggleAuth(false), 1500);
            } else {
                showToast(data.error, 'error');
            }
        }

        async function login() {
            const username = document.getElementById('login-user').value.trim();
            const password = document.getElementById('login-pass').value;

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await res.json();
            if (res.ok) {
                localStorage.setItem('token', data.token);
                showToast(data.message, 'success');
                setTimeout(() => window.location.href = '/index.html', 1000);
            } else {
                showToast(data.error, 'error');
            }
        }
    </script>
</body>
</html>
