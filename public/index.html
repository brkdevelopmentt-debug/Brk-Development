<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brk Dev - Fake Player Yönetimi</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f111a; color: #fff; display: flex; min-height: 100vh; }

        .sidebar { width: 260px; background: #181b29; border-right: 1px solid #282c40; display: flex; flex-direction: column; }
        .sidebar-brand { padding: 24px; font-size: 20px; font-weight: bold; color: #5865f2; border-bottom: 1px solid #282c40; display: flex; align-items: center; gap: 10px; }
        .sidebar-menu { list-style: none; padding: 20px 0; flex: 1; }
        .sidebar-menu li a { display: flex; align-items: center; gap: 12px; padding: 14px 24px; color: #a0a5b5; text-decoration: none; font-weight: 500; transition: 0.3s; }
        .sidebar-menu li a:hover, .sidebar-menu li.active a { background: #202436; color: #fff; border-left: 4px solid #5865f2; }

        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .user-card { background: #181b29; padding: 10px 18px; border-radius: 8px; border: 1px solid #282c40; display: flex; align-items: center; gap: 12px; }
        .role-badge { background: #5865f2; font-size: 11px; padding: 3px 8px; border-radius: 4px; font-weight: bold; text-transform: uppercase; }

        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card { background: #181b29; border: 1px solid #282c40; border-radius: 12px; padding: 24px; }
        .card h3 { font-size: 18px; margin-bottom: 16px; color: #fff; display: flex; align-items: center; gap: 10px; }

        .progress-box { margin-top: 15px; }
        .progress-bg { background: #0f111a; border-radius: 10px; height: 18px; width: 100%; overflow: hidden; border: 1px solid #282c40; position: relative; }
        .progress-fill { background: linear-gradient(90deg, #5865f2, #2ecc71); height: 100%; width: 0%; transition: width 0.5s ease; }
        .progress-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 11px; font-weight: bold; color: #fff; }

        .input-box { margin-bottom: 14px; }
        .input-box label { display: block; font-size: 12px; color: #a0a5b5; margin-bottom: 6px; }
        .input-box input, .input-box select { width: 100%; padding: 10px; background: #0f111a; border: 1px solid #282c40; border-radius: 6px; color: #fff; outline: none; }

        .btn { width: 100%; padding: 10px; background: #5865f2; border: none; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 8px; }
        .btn:hover { background: #4752c4; }

        #toast-container { position: fixed; top: 50%; right: 20px; transform: translateY(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast { pointer-events: auto; background: #1f2333; border-left: 4px solid #5865f2; color: #fff; padding: 16px 20px; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); display: flex; align-items: center; gap: 12px; min-width: 280px; max-width: 360px; animation: slideIn 0.4s ease forwards; opacity: 0; transform: translateX(100%); }
        .toast.success { border-left-color: #2ecc71; }
        .toast.error { border-left-color: #e74c3c; }
        .toast i { font-size: 20px; }
        .toast.success i { color: #2ecc71; }
        .toast.error i { color: #e74c3c; }

        @keyframes slideIn { to { opacity: 1; transform: translateX(0); } }
        @keyframes slideOut { to { opacity: 0; transform: translateX(100%); } }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div class="sidebar">
        <div class="sidebar-brand">
            <i class="fa-solid fa-code"></i> Brk Dev
        </div>
        <ul class="sidebar-menu">
            <li class="active"><a href="#"><i class="fa-solid fa-chart-line"></i> Panelim</a></li>
            <li id="admin-nav" style="display: none;"><a href="#admin-section"><i class="fa-solid fa-user-shield"></i> Admin Paneli</a></li>
            <li><a href="#" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Çıkış Yap</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="header">
            <h2>Kullanıcı Paneli</h2>
            <div class="user-card">
                <i class="fa-solid fa-circle-user fa-xl"></i>
                <div>
                    <div id="ui-username" style="font-weight: bold;">Yükleniyor...</div>
                    <span id="ui-role" class="role-badge">...</span>
                </div>
            </div>
        </div>

        <div class="grid-container">
            <div class="card">
                <h3><i class="fa-solid fa-robot"></i> Aktif Bot Durumu</h3>
                <div class="progress-box">
                    <div class="progress-bg">
                        <div class="progress-fill" id="bot-progress"></div>
                        <div class="progress-text" id="bot-progress-text">0 / 0 Bot</div>
                    </div>
                </div>
                <p style="margin-top: 15px; font-size: 13px; color: #a0a5b5;">Kalan Süre: <b id="expiry-text" style="color: #fff;">-</b></p>
            </div>

            <div class="card">
                <h3><i class="fa-solid fa-server"></i> Sunucu Ayarları</h3>
                <div class="input-box">
                    <label>Sunucu IP Adresi</label>
                    <input type="text" id="srv-ip" placeholder="185.123.45.67:30120">
                </div>
                <div class="input-box">
                    <label>CFX.re Bağlantısı</label>
                    <input type="text" id="srv-cfx" placeholder="cfx.re/join/XXXXXX">
                </div>
                <button class="btn" onclick="saveServerInfo()">Kaydet</button>
            </div>

            <div class="card">
                <h3><i class="fa-solid fa-calculator"></i> Paket Hesaplayıcı</h3>
                <div class="input-box">
                    <label>Bot Adedi</label>
                    <input type="number" id="calc-bots" value="10" min="5" max="100" onchange="calculatePrice()">
                </div>
                <div class="input-box">
                    <label>Süre Seçimi</label>
                    <select id="calc-days" onchange="calculatePrice()">
                        <option value="7">7 Günlük</option>
                        <option value="30" selected>1 Aylık (30 Gün)</option>
                    </select>
                </div>
                <p style="font-size: 16px; margin: 10px 0;">Toplam Tutar: <b id="calc-price" style="color: #2ecc71;">0 TL</b></p>
            </div>
        </div>

        <div class="card" id="admin-section" style="margin-top: 30px; display: none;">
            <h3><i class="fa-solid fa-shield-halved"></i> Yönetim İşlemleri (Admin)</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 15px;">
                <div>
                    <h4 style="margin-bottom: 10px;">Rol Değiştir</h4>
                    <div class="input-box">
                        <input type="text" id="adm-target-user" placeholder="Kullanıcı Adı">
                    </div>
                    <div class="input-box">
                        <select id="adm-new-role">
                            <option value="uye">Üye</option>
                            <option value="musteri">Müşteri</option>
                            <option value="admin">Admin</option>
                            <option value="superadmin">Süper Admin</option>
                        </select>
                    </div>
                    <button class="btn" onclick="setRole()">Rolü Güncelle</button>
                </div>
                <div>
                    <h4 style="margin-bottom: 10px;">Bot & Süre Tanımla</h4>
                    <div class="input-box">
                        <input type="text" id="grant-user" placeholder="Kullanıcı Adı">
                    </div>
                    <div class="input-box">
                        <input type="number" id="grant-bots" placeholder="Bot Sayısı (Örn: 20)">
                    </div>
                    <div class="input-box">
                        <input type="date" id="grant-date">
                    </div>
                    <button class="btn" onclick="grantBots()">Tanımla</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/login.html';
        }

        function playNotificationSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } catch (e) {}
        }

        function showToast(message, type = 'success') {
            playNotificationSound();
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const iconClass = type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation';
            toast.innerHTML = `<i class="fa-solid ${iconClass}"></i> <div>${message}</div>`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'slideOut 0.4s forwards';
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }

        let currentUser = null;

        async function init() {
            try {
                let res = await fetch('/api/me', { 
                    headers: { 'Authorization': 'Bearer ' + token } 
                });
                
                if (!res.ok) { logout(); return; }
                
                currentUser = await res.json();

                document.getElementById('ui-username').innerText = currentUser.username;
                document.getElementById('ui-role').innerText = currentUser.role;

                if (currentUser.role === 'admin' || currentUser.role === 'superadmin') {
                    document.getElementById('admin-nav').style.display = 'block';
                    document.getElementById('admin-section').style.display = 'block';
                }

                document.getElementById('srv-ip').value = currentUser.server_ip || '';
                document.getElementById('srv-cfx').value = currentUser.cfx_link || '';
                document.getElementById('expiry-text').innerText = currentUser.expiry_date || 'Tanımsız';

                let max = currentUser.max_bots || 0;
                let used = currentUser.used_bots || 0;
                let perc = max > 0 ? (used / max) * 100 : 0;
                document.getElementById('bot-progress').style.width = perc + '%';
                document.getElementById('bot-progress-text').innerText = `${used} / ${max} Bot Aktif`;

                calculatePrice();
            } catch (err) {
                logout();
            }
        }

        async function saveServerInfo() {
            const server_ip = document.getElementById('srv-ip').value;
            const cfx_link = document.getElementById('srv-cfx').value;

            const res = await fetch('/api/user/update-server', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({ server_ip, cfx_link })
            });

            const data = await res.json();
            if (res.ok) showToast(data.message, 'success');
            else showToast(data.error, 'error');
        }

        function calculatePrice() {
            let bots = parseInt(document.getElementById('calc-bots').value) || 0;
            let days = parseInt(document.getElementById('calc-days').value) || 0;
            let price = (bots * 15) * (days / 30);
            document.getElementById('calc-price').innerText = Math.round(price) + ' TL';
        }

        async function setRole() {
            const targetUsername = document.getElementById('adm-target-user').value;
            const newRole = document.getElementById('adm-new-role').value;

            const res = await fetch('/api/admin/set-role', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({ targetUsername, newRole })
            });

            const data = await res.json();
            if (res.ok) showToast(data.message, 'success');
            else showToast(data.error, 'error');
        }

        async function grantBots() {
            const targetUsername = document.getElementById('grant-user').value;
            const max_bots = document.getElementById('grant-bots').value;
            const expiry_date = document.getElementById('grant-date').value;

            const res = await fetch('/api/admin/grant-bots', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({ targetUsername, max_bots, expiry_date })
            });

            const data = await res.json();
            if (res.ok) showToast(data.message, 'success');
            else showToast(data.error, 'error');
        }

        function logout() {
            localStorage.clear();
            window.location.href = '/login.html';
        }

        init();
    </script>
</body>
</html>
