<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lux Development - Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: system-ui, -apple-system, sans-serif; }
        .card { background-color: #161b22; border: 1px solid #30363d; border-radius: 10px; }
        .form-control, .form-select { background-color: #0d1117; border: 1px solid #30363d; color: #c9d1d9; }
        .form-control:focus, .form-select:focus { background-color: #0d1117; color: #fff; border-color: #58a6ff; box-shadow: none; }
        .btn-success { background-color: #238636; border: none; }
        .btn-success:hover { background-color: #2ea043; }
        .btn-primary { background-color: #1f6feb; border: none; }
        .btn-purple { background-color: #8957e5; color: white; border: none; }
        .btn-purple:hover { background-color: #9e6aef; color: white; }
    </style>
</head>
<body>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="text-white fw-bold">Lux Development Panel</h3>
        <div>
            <span class="me-3">Hoşgeldin, <strong id="lblUsername" class="text-info">-</strong></span>
            <span>Bakiye: <strong id="lblBalance" class="text-success">0.00 €</strong></span>
        </div>
    </div>

    <div class="row g-4">
        <!-- Satın Alma Kartı -->
        <div class="col-md-6">
            <div class="card p-4">
                <h5 class="text-white mb-3">Paket Satın Al</h5>
                <div class="mb-3">
                    <label class="form-label">Süre Seçimi</label>
                    <select class="form-select" id="packageSelect">
                        <option value="1">1 Aylık (30 Gün)</option>
                    </select>
                </div>
                <h6 class="mb-3">Toplam Tutar: <span class="text-success fw-bold">10.00 €</span></h6>
                <button id="btnBuyPackage" class="btn btn-success w-100 fw-bold">⚡ Bakiyeyle Satın Al</button>
            </div>
        </div>

        <!-- Yönetici İşlemleri -->
        <div class="col-md-6" id="adminPanelBlock">
            <div class="card p-4">
                <h5 class="text-danger mb-3">🛡️ Yönetici İşlemleri</h5>
                
                <div class="row g-3">
                    <!-- Manuel Bot & Süre Tanımla -->
                    <div class="col-md-6">
                        <label class="form-label small">Manuel Bot & Süre Tanımla</label>
                        <input type="text" id="adminPackageUser" class="form-control mb-2" placeholder="Kullanıcı Adı">
                        <input type="number" id="adminPackageBots" class="form-control mb-2" placeholder="Bot Miktarı (Örn: 50)">
                        <input type="date" id="adminPackageDate" class="form-control mb-2">
                        <button id="btnAdminSetPackage" class="btn btn-primary w-100">Paket Tanımla</button>
                    </div>

                    <!-- Bakiye Yükle -->
                    <div class="col-md-6">
                        <label class="form-label small">Bakiye Yükle (EUR)</label>
                        <input type="text" id="adminBalanceUser" class="form-control mb-2" placeholder="Kullanıcı Adı">
                        <input type="number" id="adminBalanceAmount" class="form-control mb-2" placeholder="Tutar (Örn: 50)">
                        <button id="btnAdminAddBalance" class="btn btn-success w-100 mt-4">Bakiye Yükle</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
